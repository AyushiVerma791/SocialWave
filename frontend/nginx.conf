server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API requests to gateway if needed (we'll just use explicit VITE_API_URL instead)
    # location /api/ {
    #     proxy_pass http://api-gateway:4008/;
    # }
}
