apiVersion: v1
kind: Secret
metadata:
  name: socialwave-secrets
  namespace: socialwave
type: Opaque
stringData:
  JWT_SECRET: "change-this-in-production-supersecretjwtkey"
  
  # Default internal MongoDB connection strings (overridden in prod overlay for MongoDB Atlas)
  MONGO_URI_AUTH: "mongodb://mongodb:27017/auth-db"
  MONGO_URI_USER: "mongodb://mongodb:27017/user-db"
  MONGO_URI_POST: "mongodb://mongodb:27017/post-db"
  MONGO_URI_COMMENT: "mongodb://mongodb:27017/comment-db"
  MONGO_URI_FRIEND: "mongodb://mongodb:27017/friend-db"
  MONGO_URI_NOTIFY: "mongodb://mongodb:27017/notify-db"
  MONGO_URI_STORY: "mongodb://mongodb:27017/story-db"

  # Cloudinary Credentials
  CLOUDINARY_CLOUD_NAME: "placeholder_cloud_name"
  CLOUDINARY_API_KEY: "placeholder_key"
  CLOUDINARY_API_SECRET: "placeholder_secret"

  # Optional AWS S3 Configuration
  S3_BUCKET_NAME: "placeholder-bucket"
