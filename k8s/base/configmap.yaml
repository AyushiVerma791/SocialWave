apiVersion: v1
kind: ConfigMap
metadata:
  name: socialwave-config
  namespace: socialwave
data:
  NODE_ENV: "production"
  CTRL_PORT: "4000"
  AUTH_PORT: "4001"
  USER_PORT: "4002"
  POST_PORT: "4003"
  FEED_PORT: "4004"
  COMMENT_PORT: "4005"
  FRIEND_PORT: "4006"
  NOTIFY_PORT: "4007"
  GATEWAY_PORT: "4008"
  STORY_PORT: "4009"

  # Internal Kubernetes Service discovery URLs
  CTRL_URL: "http://controller-service:4000"
  AUTH_URL: "http://auth-service:4001"
  USER_URL: "http://user-service:4002"
  POST_URL: "http://post-service:4003"
  FEED_URL: "http://feed-service:4004"
  COMMENT_URL: "http://comment-service:4005"
  FRIEND_URL: "http://friend-service:4006"
  NOTIFY_URL: "http://notification-service:4007"
  STORY_URL: "http://story-service:4009"

  # Storage configuration
  STORAGE_PROVIDER: "cloudinary"
  AWS_REGION: "us-east-1"
