apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: socialwave

resources:
  - ../../base
  - local-mongodb.yaml

# In local dev, use local image tags
images:
  - name: socialwave-controller
    newName: socialwave-controller
    newTag: latest
  - name: socialwave-auth
    newName: socialwave-auth
    newTag: latest
  - name: socialwave-user
    newName: socialwave-user
    newTag: latest
  - name: socialwave-post
    newName: socialwave-post
    newTag: latest
  - name: socialwave-feed
    newName: socialwave-feed
    newTag: latest
  - name: socialwave-comment
    newName: socialwave-comment
    newTag: latest
  - name: socialwave-friend
    newName: socialwave-friend
    newTag: latest
  - name: socialwave-notification
    newName: socialwave-notification
    newTag: latest
  - name: socialwave-story
    newName: socialwave-story
    newTag: latest
  - name: socialwave-api-gateway
    newName: socialwave-api-gateway
    newTag: latest
  - name: socialwave-frontend
    newName: socialwave-frontend
    newTag: latest
