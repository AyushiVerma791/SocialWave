# ==============================================================================
# AWS Secrets Manager Integration via Secrets Store CSI Driver
# Mounts secrets directly from AWS Secrets Manager using IAM Roles for Service Accounts (IRSA)
# ==============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: socialwave-aws-secrets
  namespace: socialwave
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "socialwave/production"
        objectType: "secretsmanager"
        jmesPath:
          - path: "JWT_SECRET"
            objectAlias: "JWT_SECRET"
          - path: "MONGO_URI_AUTH"
            objectAlias: "MONGO_URI_AUTH"
          - path: "MONGO_URI_USER"
            objectAlias: "MONGO_URI_USER"
          - path: "MONGO_URI_POST"
            objectAlias: "MONGO_URI_POST"
          - path: "MONGO_URI_FEED"
            objectAlias: "MONGO_URI_FEED"
          - path: "MONGO_URI_COMMENT"
            objectAlias: "MONGO_URI_COMMENT"
          - path: "MONGO_URI_FRIEND"
            objectAlias: "MONGO_URI_FRIEND"
          - path: "MONGO_URI_NOTIFY"
            objectAlias: "MONGO_URI_NOTIFY"
          - path: "MONGO_URI_STORY"
            objectAlias: "MONGO_URI_STORY"
          - path: "CLOUDINARY_CLOUD_NAME"
            objectAlias: "CLOUDINARY_CLOUD_NAME"
          - path: "CLOUDINARY_API_KEY"
            objectAlias: "CLOUDINARY_API_KEY"
          - path: "CLOUDINARY_API_SECRET"
            objectAlias: "CLOUDINARY_API_SECRET"
  secretObjects:
    - secretName: socialwave-secrets
      type: Opaque
      data:
        - key: JWT_SECRET
          objectName: JWT_SECRET
        - key: MONGO_URI_AUTH
          objectName: MONGO_URI_AUTH
        - key: MONGO_URI_USER
          objectName: MONGO_URI_USER
        - key: MONGO_URI_POST
          objectName: MONGO_URI_POST
        - key: MONGO_URI_COMMENT
          objectName: MONGO_URI_COMMENT
        - key: MONGO_URI_FRIEND
          objectName: MONGO_URI_FRIEND
        - key: MONGO_URI_NOTIFY
          objectName: MONGO_URI_NOTIFY
        - key: MONGO_URI_STORY
          objectName: MONGO_URI_STORY
        - key: CLOUDINARY_CLOUD_NAME
          objectName: CLOUDINARY_CLOUD_NAME
        - key: CLOUDINARY_API_KEY
          objectName: CLOUDINARY_API_KEY
        - key: CLOUDINARY_API_SECRET
          objectName: CLOUDINARY_API_SECRET
